<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>XAYITMIRZO</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: dark tactical hub, wordmark on top, filter chips, card grid; a game opens as one centered column under a back link. */
:root{
  --bg:#0c0e10;--panel:#15191d;--panel2:#1d2329;--line:#2a323a;
  --text:#eceff2;--muted:#8d99a6;--hot:#ff5a1f;--tracer:#ffc23a;--acc:#ff5a1f;
  --display:'Black Ops One',Impact,'Arial Black',sans-serif;
  --body:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.shell{max-width:760px;margin:0 auto}
a:focus-visible,button:focus-visible{outline:3px solid var(--tracer);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.logo{font-family:var(--display);font-size:clamp(22px,6vw,30px);letter-spacing:.06em;color:var(--text);text-decoration:none}
.logo i{font-style:normal;color:var(--hot)}
.logo svg{width:26px;height:26px;vertical-align:-4px;margin-right:8px;stroke:var(--hot)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,7.5vw,42px);line-height:1.05;margin:0 0 8px;text-wrap:balance;text-transform:uppercase}
.sub{margin:0 0 16px;color:var(--muted);max-width:48ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);min-width:0}
.card:hover{border-color:var(--acc)}
.art{height:84px;display:flex;align-items:center;justify-content:center;color:#0c0e10;background:var(--acc) repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.1) 10px 20px)}
.art svg{width:46px;height:46px}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.cb b{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.cb span{font-size:13px;color:var(--muted)}
.cb em{font-style:normal;font-size:12px;font-weight:600;color:var(--tracer);margin-top:6px;min-height:1.2em;font-variant-numeric:tabular-nums}
.back{display:inline-block;font-weight:600;font-size:14px;color:var(--text);text-decoration:none;border:1px solid var(--line);padding:7px 12px;background:var(--panel)}
.gh{margin:14px 0 12px}
.gh .bar{height:5px;width:60px;background:var(--acc);margin-bottom:10px}
.gh h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,7vw,32px);margin:0;text-transform:uppercase;line-height:1.05}
.gh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stage{display:flex;flex-direction:column;gap:10px;max-width:480px;margin:0 auto}
.hud{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.hud i{font-style:normal}
.hud b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--text);margin-left:6px;letter-spacing:0}
.cv{position:relative;line-height:0;border:2px solid var(--acc);touch-action:none;background:#000;cursor:crosshair}
.cv canvas{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.35;background:rgba(8,10,12,.72);padding:16px;cursor:pointer}
.ov[hidden]{display:none}
.ov h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,7vw,34px);margin:0;text-transform:uppercase;color:var(--tracer)}
.ov p{margin:0;color:var(--text);font-size:14px;max-width:30ch}
.help{font-size:13px;color:var(--muted);text-align:center}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border:2px solid var(--text);background:transparent;color:var(--text);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.btn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#0c0e10}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase}
</style>
<div class="shell">
  <div class="top"><a class="logo" href="#" id="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg>XAYIT<i>MIRZO</i></a></div>
  <div id="view"></div>
</div>
<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
var store={
  get:function(k,d){try{var v=localStorage.getItem('xm-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('xm-'+k,JSON.stringify(v))}catch(e){}}
};
var GAMES=[];
function reg(g){GAMES.push(g)}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function cleanup(){
  var a=[];
  return{
    on:function(t,e,f,o){t.addEventListener(e,f,o);a.push(function(){t.removeEventListener(e,f,o)})},
    add:function(f){a.push(f)},
    free:function(){a.forEach(function(f){try{f()}catch(e){}});a=[]}
  };
}
var AC=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(f0,f1,d,v,type){
  if(!AC)return;
  try{var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
}
var SHOT=function(){beep(520,90,.07,.04,'sawtooth')};
var BOOM=function(){beep(180,35,.22,.08,'sawtooth')};

/* arcade(box,o): shared canvas game frame.
   o: id,w,h,intro,help,lives,time,mid(label),init(G),update(G,dt),draw(G,ctx),down(G,x,y),up(G,x,y),move(G,x,y) */
function arcade(box,o){
  var cl=cleanup(),W=o.w||360,H=o.h||540,alive=true,raf=0,last=0,cool=0;
  box.innerHTML='<div class="hud"><span>Ball<b data-s>0</b></span><span'+(o.mid?'':' hidden')+'><i>'+(o.mid||'')+'</i><b data-m></b></span><span>Rekord<b data-b>0</b></span></div>'+
   '<div class="cv" data-cv><canvas width="'+W+'" height="'+H+'" aria-label="O‘yin maydoni"></canvas><div class="ov" data-ov><h3>Boshlash</h3><p>'+(o.intro||'Ekranga bosing')+'</p></div></div>'+
   '<div class="help">'+(o.help||'')+'</div>';
  var cv=$('canvas',box),ctx=cv.getContext('2d'),ov=$('[data-ov]',box),sEl=$('[data-s]',box),mEl=$('[data-m]',box),bEl=$('[data-b]',box),wrap=$('[data-cv]',box);
  var G={W:W,H:H,ctx:ctx,score:0,t:0,state:'ready',keys:{},ptr:{x:W/2,y:H*.8,down:false},parts:[],lives:0,time:0,shake:0,best:store.get('best-'+o.id,0)};
  bEl.textContent=G.best;
  G.add=function(n){G.score+=n;sEl.textContent=G.score};
  G.boom=function(x,y,c,n){for(var i=0;i<(n||14);i++){var a=Math.random()*6.283,v=40+Math.random()*180;G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35+Math.random()*.4,c:c})}};
  G.hurt=function(d){if(G.state!=='play')return;G.lives-=(d||1);G.shake=.25;beep(150,45,.25,.07,'sawtooth');if(G.lives<=0)G.end('Mag‘lub bo‘ldingiz')};
  G.end=function(msg){
    if(G.state!=='play')return;
    G.state='over';cool=.5;
    var nb=G.score>G.best;
    if(nb){G.best=G.score;store.set('best-'+o.id,G.best);bEl.textContent=G.best}
    $('h3',ov).textContent=msg||'Tamom';
    $('p',ov).textContent=G.score+' ball'+(nb&&G.score>0?'. Yangi rekord!':'')+'. Qayta boshlash uchun bosing';
    ov.hidden=false;
  };
  G.dx=function(){return((G.keys.d||G.keys.arrowright)?1:0)-((G.keys.a||G.keys.arrowleft)?1:0)};
  G.dy=function(){return((G.keys.s||G.keys.arrowdown)?1:0)-((G.keys.w||G.keys.arrowup)?1:0)};
  function reset(){G.score=0;sEl.textContent=0;G.t=0;G.parts=[];G.lives=o.lives||0;G.time=o.time||0;G.shake=0;o.init(G)}
  function start(){reset();G.state='play';ov.hidden=true;audio()}
  function pos(e){var r=cv.getBoundingClientRect();G.ptr.x=(e.clientX-r.left)/r.width*W;G.ptr.y=(e.clientY-r.top)/r.height*H}
  cl.on(wrap,'pointerdown',function(e){
    e.preventDefault();pos(e);
    if(G.state!=='play'){if(cool<=0)start();return}
    G.ptr.down=true;try{wrap.setPointerCapture(e.pointerId)}catch(x){}
    if(o.down)o.down(G,G.ptr.x,G.ptr.y);
  });
  cl.on(wrap,'pointermove',function(e){pos(e);if(o.move&&G.state==='play')o.move(G,G.ptr.x,G.ptr.y)});
  function up(e){if(!G.ptr.down)return;G.ptr.down=false;if(o.up&&G.state==='play')o.up(G,G.ptr.x,G.ptr.y)}
  cl.on(wrap,'pointerup',up);cl.on(wrap,'pointercancel',up);
  cl.on(document,'keydown',function(e){
    var k=e.key.toLowerCase();G.keys[k]=1;if(e.code==='Space')G.keys.space=1;
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0&&G.state==='play')e.preventDefault();
    if((k==='enter'||e.code==='Space')&&G.state!=='play'&&cool<=0){e.preventDefault();start()}
    if(o.key&&G.state==='play')o.key(G,k);
  });
  cl.on(document,'keyup',function(e){G.keys[e.key.toLowerCase()]=0;if(e.code==='Space')G.keys.space=0});
  function loop(t){
    if(!alive)return;
    var dt=Math.min(.033,(t-last)/1000);last=t;
    if(cool>0)cool-=dt;
    if(G.state==='play'){
      G.t+=dt;
      if(o.time){G.time-=dt;if(G.time<=0){G.time=0;o.update(G,0);G.end('Vaqt tugadi')}}
      if(G.state==='play')o.update(G,dt);
    }
    for(var i=G.parts.length-1;i>=0;i--){var p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)G.parts.splice(i,1)}
    if(G.shake>0)G.shake-=dt;
    ctx.save();
    if(G.shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);
    o.draw(G,ctx);
    for(var j=0;j<G.parts.length;j++){var q=G.parts[j];ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-2,4,4)}
    ctx.globalAlpha=1;ctx.restore();
    if(o.mid){mEl.textContent=o.time?Math.ceil(G.time):Math.max(0,G.lives)}
    raf=requestAnimationFrame(loop);
  }
  reset();last=performance.now();raf=requestAnimationFrame(loop);
  cl.add(function(){alive=false;cancelAnimationFrame(raf)});
  return cl.free;
}

/* ---------- havo: vertikal otishmalar ---------- */
var SH={
  ship:[[0,-1],[.7,.8],[0,.4],[-.7,.8]],
  plane:[[0,-1],[.15,-.3],[1,.2],[1,.4],[.15,.3],[.3,.9],[0,.8],[-.3,.9],[-.15,.3],[-1,.4],[-1,.2],[-.15,-.3]],
  rock:[[0,-1],[.8,-.5],[1,.2],[.5,.9],[-.3,1],[-.9,.4],[-.8,-.4]]
};
function poly(c,shape,x,y,s,flip,fill,stroke){
  c.beginPath();
  for(var i=0;i<shape.length;i++){var px=x+shape[i][0]*s,py=y+shape[i][1]*s*(flip?-1:1);i?c.lineTo(px,py):c.moveTo(px,py)}
  c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}
}
function vshoot(c){
  return function(box){return arcade(box,{
    id:c.id,w:360,h:540,lives:3,mid:'Jon',
    intro:c.intro,help:'Barmoq yoki sichqoncha bilan kemani boshqaring, u o‘zi otadi. Klaviaturada A / D.',
    init:function(G){
      G.p={x:180,y:470,cd:0,inv:0};G.b=[];G.e=[];G.eb=[];G.sp=1;G.kills=0;G.next=c.boss?12:1e9;G.boss=null;
      G.bg=[];for(var i=0;i<26;i++)G.bg.push({x:rnd(0,360),y:rnd(0,540),s:rnd(.6,2.4)});
    },
    update:function(G,dt){
      var p=G.p;
      var tx=G.ptr.x,ty=clamp(G.ptr.y-46,300,500);
      p.x+=(tx-p.x)*Math.min(1,dt*14);p.y+=(ty-p.y)*Math.min(1,dt*10);
      p.x=clamp(p.x+G.dx()*300*dt,18,342);
      if(p.inv>0)p.inv-=dt;
      p.cd-=dt;
      if(p.cd<=0){
        p.cd=.17;var n=G.score>=600?3:G.score>=180?2:1;
        for(var i=0;i<n;i++){var off=(i-(n-1)/2)*12;G.b.push({x:p.x+off,y:p.y-16,vx:off*3,vy:-540})}
        SHOT();
      }
      for(var i=G.bg.length-1;i>=0;i--){var s=G.bg[i];s.y+=s.s*(c.clouds?30:50)*dt;if(s.y>550){s.y=-10;s.x=rnd(0,360)}}
      G.sp-=dt;
      if(G.sp<=0&&!G.boss){
        G.sp=Math.max(.38,1.05-G.t*.007);
        var tough=Math.random()<Math.min(.4,.05+G.t*.004);
        G.e.push({x:rnd(30,330),y:-24,vy:rnd(60,100)+G.t*.5,hp:tough?3:1,mhp:tough?3:1,r:tough?20:15,ph:rnd(0,6),sh:rnd(1,2.5)});
      }
      if(c.boss&&!G.boss&&G.kills>=G.next){G.boss={x:180,y:-60,hp:40,mhp:40,dir:1,sh:1,r:44};G.next+=14;G.e.length=0}
      for(var i=G.b.length-1;i>=0;i--){var b=G.b[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20)G.b.splice(i,1)}
      for(var i=G.e.length-1;i>=0;i--){
        var e=G.e[i];e.y+=e.vy*dt;e.x+=Math.sin(G.t*2+e.ph)*40*dt;
        if(c.shoot){e.sh-=dt;if(e.sh<=0&&e.y>0&&e.y<350){e.sh=rnd(1.6,3);var a=Math.atan2(p.y-e.y,p.x-e.x);G.eb.push({x:e.x,y:e.y+12,vx:Math.cos(a)*170,vy:Math.sin(a)*170})}}
        var dead=false;
        for(var j=G.b.length-1;j>=0;j--){var b=G.b[j];if(Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r+4){G.b.splice(j,1);e.hp--;G.boom(b.x,b.y,'#ffc23a',3);if(e.hp<=0){dead=true;break}}}
        if(dead){G.add(e.mhp>1?30:10);G.kills++;G.boom(e.x,e.y,c.en,16);BOOM();G.e.splice(i,1);continue}
        if(p.inv<=0&&dist(e,p)<e.r+12){G.e.splice(i,1);G.boom(p.x,p.y,'#ff5a1f',20);p.inv=1.4;G.hurt();continue}
        if(e.y>570)G.e.splice(i,1);
      }
      var B=G.boss;
      if(B){
        B.y=Math.min(90,B.y+60*dt);B.x+=B.dir*70*dt;if(B.x>310||B.x<50)B.dir*=-1;
        B.sh-=dt;if(B.sh<=0){B.sh=.9;for(var k=-2;k<=2;k++){var a=Math.PI/2+k*.28;G.eb.push({x:B.x,y:B.y+30,vx:Math.cos(a)*170,vy:Math.sin(a)*170})}}
        for(var j=G.b.length-1;j>=0;j--){var b=G.b[j];if(Math.abs(b.x-B.x)<B.r&&Math.abs(b.y-B.y)<30){G.b.splice(j,1);B.hp--;G.boom(b.x,b.y,'#ffc23a',2);if(B.hp<=0){G.add(300);G.boom(B.x,B.y,c.en,60);BOOM();G.boss=null;G.sp=2;break}}}
      }
      for(var i=G.eb.length-1;i>=0;i--){
        var q=G.eb[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
        if(q.y>560||q.x<-10||q.x>370){G.eb.splice(i,1);continue}
        if(p.inv<=0&&dist(q,p)<12){G.eb.splice(i,1);G.boom(p.x,p.y,'#ff5a1f',20);p.inv=1.4;G.hurt()}
      }
    },
    draw:function(G,x){
      var gr=x.createLinearGradient(0,0,0,540);gr.addColorStop(0,c.bg[0]);gr.addColorStop(1,c.bg[1]);x.fillStyle=gr;x.fillRect(0,0,360,540);
      x.fillStyle=c.clouds?'rgba(255,255,255,.75)':'#ffffff';
      for(var i=0;i<G.bg.length;i++){var s=G.bg[i];if(c.clouds){x.fillRect(s.x,s.y,s.s*26,s.s*7)}else{x.globalAlpha=.4+s.s*.2;x.fillRect(s.x,s.y,s.s,s.s)}}
      x.globalAlpha=1;
      x.fillStyle='#ffc23a';for(var i=0;i<G.b.length;i++)x.fillRect(G.b[i].x-1.5,G.b[i].y-8,3,14);
      x.fillStyle='#ff5a1f';for(var i=0;i<G.eb.length;i++){x.beginPath();x.arc(G.eb[i].x,G.eb[i].y,5,0,6.283);x.fill()}
      for(var i=0;i<G.e.length;i++){
        var e=G.e[i];
        if(c.eshape==='ufo'){x.fillStyle=c.en;x.beginPath();x.ellipse(e.x,e.y,e.r,e.r*.5,0,0,6.283);x.fill();x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(e.x,e.y-e.r*.3,e.r*.4,Math.PI,0);x.fill()}
        else poly(x,SH[c.eshape],e.x,e.y,e.r,c.eshape!=='rock',c.en,'rgba(0,0,0,.35)');
      }
      var B=G.boss;
      if(B){poly(x,SH.plane,B.x,B.y,B.r,true,c.en,'#000');x.fillStyle='#2a323a';x.fillRect(40,12,280,8);x.fillStyle='#ff5a1f';x.fillRect(40,12,280*B.hp/B.mhp,8)}
      var p=G.p;
      if(G.state==='play'&&(p.inv<=0||Math.floor(G.t*14)%2)){
        x.fillStyle='#ffc23a';x.beginPath();x.moveTo(p.x-5,p.y+14);x.lineTo(p.x,p.y+22+Math.random()*8);x.lineTo(p.x+5,p.y+14);x.fill();
        poly(x,SH[c.me],p.x,p.y,18,false,c.mc,'rgba(0,0,0,.4)');
      }
    }
  })}
}
reg({id:'kosmik',name:'Kosmik hujum',desc:'Begona kemalarni urib tushiring',cat:'havo',acc:'#4cc3ff',
  mount:vshoot({id:'kosmik',intro:'Kemangiz o‘zi otadi. Faqat dushmanlardan qoching.',bg:['#070b24','#1b1450'],me:'ship',mc:'#e8f4ff',eshape:'ufo',en:'#ff6fae',shoot:false})});
reg({id:'samolyot',name:'Samolyot jangi',desc:'Dushman samolyotlari sizga o‘q otadi',cat:'havo',acc:'#7bd88f',

function gallery(c){
  return function(box){return arcade(box,{
    id:c.id,w:360,h:480,lives:c.lives||0,time:c.time||0,mid:c.time?'Vaqt':(c.lives?'Jon':''),
    intro:c.intro,help:c.help||'Nishonga bosing yoki sichqoncha bilan o‘q uzing.',
    init:function(G){G.T=[];G.sp=.4;G.ammo=c.mag||99;G.rl=0;G.fl=null;G.endT=0;G.bul=c.bullets||0;if(c.init)c.init(G)},
    update:function(G,dt){
      if(G.rl>0){G.rl-=dt;if(G.rl<=0)G.ammo=c.mag}
      if(G.fl){G.fl.t-=dt;if(G.fl.t<=0)G.fl=null}
      if(G.endT>0){G.endT-=dt;if(G.endT<=0){G.end('O‘q tugadi');return}}
      c.update(G,dt);
      for(var i=G.T.length-1;i>=0;i--){var e=G.T[i];if(c.step)c.step(G,e,dt);if(e.gone){if(c.gone)c.gone(G,e);G.T.splice(i,1)}}
    },
    down:function(G,x,y){
      if(G.endT>0)return;
      if(c.mag&&(G.rl>0||G.ammo<=0))return;
      if(c.bullets){if(G.bul<=0)return;G.bul--}
      if(c.mag){G.ammo--;if(G.ammo<=0)G.rl=c.reload||1}
      var sx=x,sy=y;if(c.aim){var a=c.aim(G,x,y);sx=a[0];sy=a[1]}
      G.fl={x:sx,y:sy,t:.12};SHOT();
      var hitAny=false;
      for(var i=G.T.length-1;i>=0;i--){var e=G.T[i];if(e.dead)continue;if(c.test(e,sx,sy)){hitAny=true;c.hit(G,e,sx,sy);break}}
      if(!hitAny&&c.miss)c.miss(G,sx,sy);
      if(c.bullets&&G.bul<=0&&G.state==='play')G.endT=c.endDelay||1.2;
    },
    draw:function(G,x){
      c.bg(G,x);
      for(var i=0;i<G.T.length;i++)c.draw(x,G.T[i],G);
      if(c.over)c.over(G,x);
      if(G.fl){x.strokeStyle='#ffc23a';x.lineWidth=2;x.beginPath();x.arc(G.fl.x,G.fl.y,8+G.fl.t*60,0,6.283);x.stroke()}
      if(!c.noCross&&G.state==='play'){var p=G.ptr;x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,10,0,6.283);x.moveTo(p.x-16,p.y);x.lineTo(p.x+16,p.y);x.moveTo(p.x,p.y-16);x.lineTo(p.x,p.y+16);x.stroke()}
      var n=c.mag?G.ammo:(c.bullets?G.bul:0);
      if(n||G.rl>0){x.fillStyle='#ffc23a';var tot=c.mag||Math.min(G.bul,20);for(var k=0;k<tot;k++)x.fillRect(10+k*9,462,5,12);if(G.rl>0){x.fillStyle='#fff';x.font='bold 12px sans-serif';x.fillText('ZARYAD...',10,454)}}
    }
  })}
}

reg({id:'top',name:'To‘p otish',desc:'Burchak va kuchni tanlab, nishonni urib tushiring',cat:'himoya',acc:'#ffb347',

        if(pr.y>410||pr.x>380||pr.x<-20||(pr.x>h.x&&pr.x<h.x+h.w&&pr.y>410-h.h)){G.boom(pr.x,Math.min(pr.y,410),'#8d99a6',10);BOOM();G.pr=null}

      x.fillStyle='#2a323a';x.beginPath();x.arc(G.cn.x,G.cn.y,16,Math.PI,0);x.fill();x.fillRect(G.cn.x-18,G.cn.y,36,10);
      var v=G.vec?G.vec(G):{a:-.8,p:200};x.save();x.translate(G.cn.x,G.cn.y-6);x.rotate(v.a);x.fillStyle='#10141c';x.fillRect(0,-5,28,10);x.restore();

  mount:function(box){return arcade(box,{

var ICON={
 havo:'<svg viewBox="0 0 48 48" fill="currentColor"><path d="M24 4l8 24-8-4-8 4z"/><path d="M10 40l14-10 14 10-14-4z" opacity=".7"/></svg>',
 nishon:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4"><circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="9"/><circle cx="24" cy="24" r="2" fill="currentColor"/></svg>',

};
var view=$('#view'),destroy=null,filter=store.get('filter','all');
function hub(){
  document.title='XAYITMIRZO';
  document.documentElement.style.setProperty('--acc','#ff5a1f');
  var h='<h1>'+GAMES.length+' ta otishma o‘yin</h1><p class="sub">Bittasini tanlang va nishonga oling. Telefonda ham, kompyuterda ham ishlaydi. Rekordlaringiz shu qurilmada saqlanadi.</p><div class="chips" role="group" aria-label="Turkum">';
  CATS.forEach(function(c){h+='<button class="chip" type="button" data-f="'+c[0]+'" aria-pressed="'+(filter===c[0])+'">'+c[1]+'</button>'});
  h+='</div><div class="grid">';
  GAMES.forEach(function(g){
    if(filter!=='all'&&g.cat!==filter)return;
    var b=store.get('best-'+g.id,0);
    h+='<a class="card" href="#'+g.id+'" style="--acc:'+g.acc+'"><div class="art">'+ICON[g.cat]+'</div><div class="cb"><b>'+g.name+'</b><span>'+g.desc+'</span><em>'+(b?'Rekord: '+b:'&nbsp;')+'</em></div></a>';
  });
  view.innerHTML=h+'</div><div class="foot">XAYITMIRZO o‘yinxonasi</div>';
  var chips=view.querySelectorAll('.chip');
  for(var i=0;i<chips.length;i++)chips[i].addEventListener('click',function(e){filter=e.currentTarget.getAttribute('data-f');store.set('filter',filter);hub()});
}
function openGame(g){
  document.title=g.name+' | XAYITMIRZO';
  view.innerHTML='<a class="back" href="#">&larr; Barcha o‘yinlar</a><div class="gh" style="--acc:'+g.acc+'"><div class="bar"></div><h2>'+g.name+'</h2><p>'+g.desc+'</p></div><div class="stage" id="stage" style="--acc:'+g.acc+'"></div>';
  destroy=g.mount($('#stage'));
}
function route(){
  if(destroy){destroy();destroy=null}
  var id=location.hash.replace('#',''),g=null;
  for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===id)g=GAMES[i];
  window.scrollTo(0,0);
  if(g)openGame(g);else hub();
}
window.addEventListener('hashchange',route);
route();
})();
</script>
